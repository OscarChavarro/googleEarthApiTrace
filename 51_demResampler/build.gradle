plugins {
    id 'application'
}

group = 'co.cubestudio'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'demresampler.Main'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'co.cubestudio:base:1.3'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def nativeOutputDirectory = layout.buildDirectory.dir('native')
def nativeLibrary = nativeOutputDirectory.map { it.file('libdemresampler_gdal.so') }
def javaHome = providers.systemProperty('java.home')

tasks.register('compileNative', Exec) {
    inputs.file('src/main/cpp/demresampler_gdal.cpp')
    outputs.file(nativeLibrary)
    doFirst {
        nativeOutputDirectory.get().asFile.mkdirs()
        def gdalCFlags = providers.exec {
            commandLine 'gdal-config', '--cflags'
        }.standardOutput.asText.get().trim().split(/\s+/).findAll { !it.isBlank() }
        def gdalLibraries = providers.exec {
            commandLine 'gdal-config', '--libs'
        }.standardOutput.asText.get().trim().split(/\s+/).findAll { !it.isBlank() }
        commandLine([
            'g++',
            '-std=c++17',
            '-O3',
            '-fPIC',
            '-shared',
            "-I${javaHome.get()}/include",
            "-I${javaHome.get()}/include/linux"
        ] + gdalCFlags + [
            'src/main/cpp/demresampler_gdal.cpp',
            '-o',
            nativeLibrary.get().asFile.absolutePath
        ] + gdalLibraries)
    }
}

tasks.withType(JavaExec).configureEach {
    dependsOn tasks.named('compileNative')
    workingDir = projectDir
    jvmArgs "-Djava.library.path=${nativeOutputDirectory.get().asFile.absolutePath}"
}

test {
    dependsOn tasks.named('compileNative')
    useJUnitPlatform()
    jvmArgs "-Djava.library.path=${nativeOutputDirectory.get().asFile.absolutePath}"
}
