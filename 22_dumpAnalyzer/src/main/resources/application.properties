output.directory=/media/ramdisk/output
frame.import.threads=72
frame.neighbor.threads=8
frame.writer.threads=2
topLevelTile.threads=8
frame.validateTraceSyntax=false
# OCR is optional metadata and the native Paddle runtime can terminate the JVM
# with SIGSEGV, which Java cannot catch. Keep it opt-in so tile extraction can
# always continue; set LOCAL_OCR_ENABLED=true explicitly to enable it.
localOcr.enabled=false
localOcr.threads=1
localOcr.lang=en
localOcr.library.path=../24_localOcr/build/liblocalOcr.so
