plugins {
    id 'application'
}

group = 'org.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'planetdemviewer.Main'
}

tasks.withType(JavaExec).configureEach {
    workingDir = projectDir
    def configuredHeap = System.getenv('PLANET_DEM_MAX_HEAP')
    if (configuredHeap != null && !configuredHeap.isBlank()) {
        maxHeapSize = configuredHeap
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://jogamp.org/deployment/maven')
    }
}

dependencies {
    implementation 'co.cubestudio:base:1.3'
    implementation 'co.cubestudio:awt:1.3'
    implementation 'co.cubestudio:jogl4:1.3'
    implementation 'org.jogamp.jogl:jogl-all:2.5.0'
    implementation 'org.jogamp.gluegen:gluegen-rt:2.5.0'
    runtimeOnly 'org.jogamp.jogl:jogl-all-main:2.5.0'
    runtimeOnly 'org.jogamp.gluegen:gluegen-rt-main:2.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test') {
    useJUnitPlatform()
}
